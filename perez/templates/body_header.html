<header class="perez_header perez_header_{{ current_lang }}" role="banner">
    <div class="row" >
        <a href="{{ lang_prefix }}/" class=perez_heading>
            <h1>perez<img class="perez_pic" src="{{ url_for("static", filename="img/spiderlily.png") }}"></img>wiki</h1>
        </a>
    </div>

    <div class="row">
        {% for slug, label in nav %}
        <div class="three columns">
            <a class="button" href="{{ lang_prefix }}/{{ slug }}">{{ label }}</a>
        </div>
        {% endfor %}
    </div>
</header>
